[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcouncil"
dynamic = ["version"]
description = "QuantCouncil: A-share multi-agent LLM research and paper-trading platform, built on TradingAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.5",
    "langchain-anthropic>=1.7.4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdown-it-py>=4.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.7.9",
]
# China A-share market data (AKShare: Sina/Tencent/Eastmoney/cninfo/Cailian; BaoStock).
cn = [
    "akshare>=1.19.1",
    "baostock>=0.9.4",
]
# The QuantCouncil platform: API, workers, MCP server, RAG, memory, observability.
platform = [
    "quantcouncil[cn]",
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.5.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "alembic>=1.20.0",
    "psycopg[binary,pool]>=3.3.6",
    "pgvector>=0.5.1",
    "langgraph-checkpoint-postgres>=3.2.0",
    "redis>=8.1.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "mcp>=1.30,<2",
    "langchain-mcp-adapters>=0.3.2",
    "langfuse>=5.0.1",
    "fastembed>=0.9.0",
    "jieba>=0.42.1",
    "pypdf>=6.0",
    "httpx>=0.28.1",
    "cryptography>=45",
    "python-docx>=1.2",
    "reportlab>=4.4",
]
platform-dev = [
    "quantcouncil[platform,dev]",
    "pytest-asyncio>=1.4.0",
    "fakeredis>=2.40.0",
]

[project.scripts]
tradingagents = "cli.main:app"
quantcouncil-mcp = "quantcouncil.mcp_server.server:main"
quantcouncil-eval = "quantcouncil.evals.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "quantcouncil.__version__"}

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "quantcouncil*"]

[tool.setuptools.package-data]
cli = ["static/*"]
tradingagents = ["assets/*.svg"]
quantcouncil = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration\""
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services; run only when asked for, with -m integration",
    "smoke: quick sanity-check tests",
    "postgres: tests that need the Postgres from docker compose (QUANTCOUNCIL_TEST_DATABASE_URL)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor imports in router.py) instead of one statement per name.
combine-as-imports = true
