apiVersion: batch/v1
kind: Job
metadata:
  name: finagent-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: finagent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: finagent-config}
            - secretRef: {name: finagent-secrets}
