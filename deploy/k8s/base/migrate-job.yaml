apiVersion: batch/v1
kind: Job
metadata:
  name: quantcouncil-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: quantcouncil
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: quantcouncil-config}
            - secretRef: {name: quantcouncil-secrets}
