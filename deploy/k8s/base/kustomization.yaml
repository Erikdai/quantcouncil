# kubectl apply -k deploy/k8s/base
# For production, swap the in-cluster Postgres/Redis for managed services
# (set QUANTCOUNCIL_DATABASE_URL / QUANTCOUNCIL_REDIS_URL in the secret) and drop infra.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quantcouncil
resources:
  - namespace.yaml
  - configmap.yaml
  - infra.yaml
  - migrate-job.yaml
  - mcp.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
secretGenerator:
  - name: quantcouncil-secrets
    envs:
      - secrets.env   # copy secrets.env.example -> secrets.env (git-ignored)
images:
  - name: quantcouncil
    newName: ghcr.io/your-org/quantcouncil
    newTag: latest
  - name: quantcouncil-web
    newName: ghcr.io/your-org/quantcouncil-web
    newTag: latest
