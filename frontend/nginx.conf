# QuantCouncil web: serves the SPA and proxies /api/ to the FastAPI service.
# Installed as /etc/nginx/conf.d/default.conf in the nginx:1.27-alpine image.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve the API through Docker's embedded DNS at request time, so nginx
    # starts even when the `api` container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # --- API, including the two Server-Sent Events streams ----------------
    #   GET  /api/runs/{id}/events   (run progress)
    #   POST /api/research/chat      (streamed chat answer)
    location /api/ {
        # No URI part: the original /api/... path is passed through unchanged.
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: never buffer, cache or compress; keep long-lived streams open.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;

        client_max_body_size 10m;
    }

    # --- Hashed build assets: cache forever --------------------------------
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- SPA history fallback ----------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
